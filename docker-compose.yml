services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-plataforma_cursos}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-plataforma_cursos}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: sh -c "npx prisma generate && npx prisma db push && npx ts-node prisma/seed.ts && npx ts-node src/main.ts"

  studio:
    build:
      context: ./backend
    ports:
      - "5556:5555"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-plataforma_cursos}?schema=public"
    command: npx prisma studio --port 5555 --hostname 0.0.0.0
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: https://localhost/api
    command: npm run preview -- --host 0.0.0.0 --port 5173

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
